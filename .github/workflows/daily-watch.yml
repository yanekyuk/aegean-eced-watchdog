name: Daily Aegean e-ÇED Watch

on:
  schedule:
    # 04:15 UTC = 07:15 TRT daily
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "14"
      max_digests:
        description: "Max new PDFs to digest"
        required: false
        default: "4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "eced-watch"
  cancel-in-progress: false

jobs:
  watch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Run incremental e-ÇED watch, PDF digest & static build
        env:
          DAYS: ${{ github.event.inputs.days || '14' }}
          MAX_DIGESTS: ${{ github.event.inputs.max_digests || '4' }}
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: |
          uv run eced-watch \
            --days "$DAYS" \
            --max-digests "$MAX_DIGESTS" \
            --drop-pdfs \
            --site-url "$SITE_URL"

      - name: Commit updated registry, digests & static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/filings.json data/digests/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(watch): update Aegean e-ÇED filings & digests ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy-pages:
    needs: watch-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
